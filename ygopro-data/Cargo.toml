[package]
name = "ygopro-data"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Data models for the YGOPro protocol: cards, messages and replay structures."
readme = "README.md"
keywords = ["ygopro"]


[dependencies]
binrw = "0.13"
bitflags = "2.4"
encoding_rs = "0.8"
lzma-rs = "0.3"
num_enum = "0.7"
thiserror = "1"
rusqlite = { version = "0.39", features = ["bundled", "serialize"], optional = true }
ygopro-derive.workspace = true
bytes = "1.11.1"
modular-bitfield = "0.13.1"

[build-dependencies]
syn = "1.0"
darling = "0.14"

[features]
default = ["card"]
card=["dep:rusqlite"]
