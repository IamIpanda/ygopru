[package]
name = "ygopro"
version = "0.1.0"
edition = "2021"

[lib]
name = "ygopro"
path = "src/lib.rs"

[[bin]]
name = "ygopro"
path = "src/main.rs"

[dependencies]
binrw = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
rand = "0.8"

ygopro-data = { path = "../ygopro-data" }
ygopro-core-wrapper = { path = "../ygopro-core-wrapper" }
