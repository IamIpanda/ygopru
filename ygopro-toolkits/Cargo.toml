[package]
name = "ygopro-toolkits"
version = "0.1.1"
edition.workspace = true
publish = false
license-file.workspace = true
repository.workspace = true
description = "CLI tools for the YGOPro server: replay validation and duel setup."
keywords = ["ygopro"]

[[bin]]
name = "ygopro-toolkits"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
binrw = "0.13"
futures = "0.3"
base64 = "0.22"
bytes = "1"
log = "0.4"
pretty_env_logger = "0.5"
thiserror = "1"

ygopro-data.workspace = true
ygopro.workspace = true
ygopro-core-wrapper.workspace = true
ygopro-handler.workspace = true
ygopro-external-server-bridge.workspace = true

[features]
default = ["card", "zip"]
card = [
    "ygopro/card",
    "ygopro-core-wrapper/card",
    "ygopro-data/card",
    "ygopro-external-server-bridge/card",
]
zip = ["ygopro/zip"]
