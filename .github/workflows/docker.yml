name: Docker

on:
  push:
    tags: ["v*"]

jobs:
  build-and-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Official core
            flavor: official
            suffix: ""
            alias: latest
          - name: Koishi core
            flavor: koishi
            suffix: "-koishi"
            alias: koishi-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Extract cargo version of the ygopro package
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ygopro") | .version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FLAVOR=${{ matrix.flavor }}
          tags: |
            iami/ygopru:${{ steps.version.outputs.version }}${{ matrix.suffix }}
            iami/ygopru:${{ matrix.alias }}
