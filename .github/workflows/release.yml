name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flavor: official
            artifact: linux-x86_64
          - os: ubuntu-latest
            flavor: koishi
            artifact: linux-x86_64
          - os: macos-15
            flavor: official
            artifact: macos-aarch64
          - os: macos-15
            flavor: koishi
            artifact: macos-aarch64
          - os: windows-latest
            flavor: official
            artifact: windows-x86_64
          - os: windows-latest
            flavor: koishi
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract cargo version
        id: version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ygopro") | .version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.flavor }}" = "koishi" ]; then
            cargo build --release -p ygopro --features koishi
          else
            cargo build --release -p ygopro
          fi

      - name: Compress binaries with UPX
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install upx -y
            UPX_COMMAND="upx"
            BIN="target/release/ygopro.exe"
          else
            sudo apt-get update
            sudo apt-get install -y upx-ucl
            UPX_COMMAND="upx-ucl"
            BIN="target/release/ygopro"
          fi
          "$UPX_COMMAND" --best "$BIN"

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/release/ygopro.exe" "ygopro.exe"
            cp "target/release/ygopro.dll" "ygopro.dll"
            TARBALL_FILES="ygopro.exe ygopro.dll"
          else
            cp "target/release/ygopro" "ygopro"
            if [ "$RUNNER_OS" = "macOS" ]; then
              cp "target/release/libygopro.dylib" "libygopro.dylib"
              TARBALL_FILES="ygopro libygopro.dylib"
            else
              cp "target/release/libygopro.so" "libygopro.so"
              TARBALL_FILES="ygopro libygopro.so"
            fi
          fi
          tar -czf "ygopro-${{ steps.version.outputs.version }}-${{ matrix.flavor }}-${{ matrix.artifact }}.tar.gz" $TARBALL_FILES

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ygopro-${{ steps.version.outputs.version }}-${{ matrix.flavor }}-${{ matrix.artifact }}
          path: "ygopro-${{ steps.version.outputs.version }}-${{ matrix.flavor }}-${{ matrix.artifact }}.tar.gz"
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
