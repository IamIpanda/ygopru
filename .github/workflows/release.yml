name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 official
            kind: executable
            os: ubuntu-latest
            arch: x86_64
            flavor: official
            artifact: linux-x86_64
          - name: Linux x86_64 koishi
            kind: executable
            os: ubuntu-latest
            arch: x86_64
            flavor: koishi
            artifact: linux-x86_64
          - name: Linux arm64 official
            kind: executable
            os: ubuntu-24.04-arm
            arch: arm64
            flavor: official
            artifact: linux-arm64
          - name: Linux arm64 koishi
            kind: executable
            os: ubuntu-24.04-arm
            arch: arm64
            flavor: koishi
            artifact: linux-arm64
          - name: macOS x86_64 official
            kind: executable
            os: macos-15-intel
            arch: x86_64
            flavor: official
            artifact: macos-x86_64
          - name: macOS x86_64 koishi
            kind: executable
            os: macos-15-intel
            arch: x86_64
            flavor: koishi
            artifact: macos-x86_64
          - name: macOS arm64 official
            kind: executable
            os: macos-15
            arch: arm64
            flavor: official
            artifact: macos-arm64
          - name: macOS arm64 koishi
            kind: executable
            os: macos-15
            arch: arm64
            flavor: koishi
            artifact: macos-arm64
          - name: Windows x86_64 official
            kind: executable
            os: windows-latest
            arch: x86_64
            flavor: official
            artifact: windows-x86_64
          - name: Windows x86_64 koishi
            kind: executable
            os: windows-latest
            arch: x86_64
            flavor: koishi
            artifact: windows-x86_64
          - name: Windows arm64 official
            kind: executable
            os: windows-11-arm
            arch: arm64
            flavor: official
            artifact: windows-arm64
          - name: Windows arm64 koishi
            kind: executable
            os: windows-11-arm
            arch: arm64
            flavor: koishi
            artifact: windows-arm64
          - name: Android arm64-v8a
            kind: android
            os: ubuntu-latest
            abi: arm64-v8a
            target: aarch64-linux-android
            cc: aarch64-linux-android21-clang
            cxx: aarch64-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - name: Android armeabi-v7a
            kind: android
            os: ubuntu-latest
            abi: armeabi-v7a
            target: armv7-linux-androideabi
            cc: armv7a-linux-androideabi21-clang
            cxx: armv7a-linux-androideabi21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - name: Android x86
            kind: android
            os: ubuntu-latest
            abi: x86
            target: i686-linux-android
            cc: i686-linux-android21-clang
            cxx: i686-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
          - name: Android x86_64
            kind: android
            os: ubuntu-latest
            abi: x86_64
            target: x86_64-linux-android
            cc: x86_64-linux-android21-clang
            cxx: x86_64-linux-android21-clang++
            ar: llvm-ar
            output: libygoserver.so
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust toolchain for executables
        if: matrix.kind == 'executable'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust toolchain for Android
        if: matrix.kind == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Set up Android NDK
        if: matrix.kind == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Extract cargo version
        if: matrix.kind == 'executable'
        id: version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ygopro") | .version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        if: matrix.kind == 'executable'
        shell: bash
        run: |
          if [ "${{ matrix.flavor }}" = "koishi" ]; then
            cargo build --release -p ygopro --features koishi
          else
            cargo build --release -p ygopro
          fi

      - name: Build Android library
        if: matrix.kind == 'android'
        shell: bash
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_TOOLCHAIN" ]; then
            NDK_TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          fi
          echo "Using Android NDK toolchain: $NDK_TOOLCHAIN"
          ls "$NDK_TOOLCHAIN"/${{ matrix.cc }}

          export PATH="$NDK_TOOLCHAIN:$PATH"
          export CC="$NDK_TOOLCHAIN/${{ matrix.cc }}"
          export CXX="$NDK_TOOLCHAIN/${{ matrix.cxx }}"
          export AR="$NDK_TOOLCHAIN/${{ matrix.ar }}"
          export TARGET_CC="$CC"
          export TARGET_CXX="$CXX"
          export TARGET_AR="$AR"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/aarch64-linux-android21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_TOOLCHAIN/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_I686_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/i686-linux-android21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/x86_64-linux-android21-clang"

          cargo build --release --lib -p ygopro-external-mobile-bridge --target ${{ matrix.target }} --features koishi

      - name: Compress binaries with UPX
        if: matrix.kind == 'executable' && matrix.arch == 'x86_64' && runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install upx -y
            UPX_COMMAND="upx"
            BIN="target/release/ygopro.exe"
          else
            sudo apt-get update
            sudo apt-get install -y upx-ucl
            UPX_COMMAND="upx-ucl"
            BIN="target/release/ygopro"
          fi
          "$UPX_COMMAND" --best "$BIN"

      - name: Package executable
        if: matrix.kind == 'executable'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            TARBALL_FILES="ygopro.exe ygopro.dll"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            TARBALL_FILES="ygopro libygopro.dylib"
          else
            TARBALL_FILES="ygopro libygopro.so"
          fi
          tar -czf "ygopro-${{ steps.version.outputs.version }}-${{ matrix.flavor }}-${{ matrix.artifact }}.tar.gz" -C target/release $TARBALL_FILES

      - name: Package Android library
        if: matrix.kind == 'android'
        shell: bash
        run: |
          mkdir -p dist/android/${{ matrix.abi }}
          cp target/${{ matrix.target }}/release/${{ matrix.output }} \
            dist/android/${{ matrix.abi }}/libygoserver-${{ matrix.abi }}.so

      - name: Upload executable artifact
        if: matrix.kind == 'executable'
        uses: actions/upload-artifact@v4
        with:
          name: ygopro-${{ steps.version.outputs.version }}-${{ matrix.flavor }}-${{ matrix.artifact }}
          path: "ygopro-${{ steps.version.outputs.version }}-${{ matrix.flavor }}-${{ matrix.artifact }}.tar.gz"
          if-no-files-found: error

      - name: Upload Android artifact
        if: matrix.kind == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ygoserver-android-${{ matrix.abi }}
          path: dist/android/${{ matrix.abi }}/libygoserver-${{ matrix.abi }}.so
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.so

      - name: Delete previous release-latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view release-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete release-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/release-latest" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/release-latest"
          fi

      - name: Publish release-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          name: release-latest
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.so
