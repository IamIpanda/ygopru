name: Cargo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Inject versions and publish unpublished crates
        run: bash .github/scripts/publish_cargo.sh Cargo.toml publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
