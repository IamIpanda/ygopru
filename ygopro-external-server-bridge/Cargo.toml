[package]
name = "ygopro-external-server-bridge"
version = "0.1.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "A ygopro-handler RoomProvider that runs an external YGOPro binary as the duel backend."
readme = "README.md"
keywords = ["ygopro"]

[lib]
name = "ygopro_external_server_bridge"
path = "src/room_provider.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
binrw = "0.13"
futures = "0.3"
bytes = "1"
base64 = "0.22"
log = "0.4"

ygopro-core-wrapper.workspace = true
ygopro-data.workspace = true
ygopro-handler.workspace = true

[features]
default = []
card = [
    "ygopro-core-wrapper/card",
    "ygopro-data/card",
]
