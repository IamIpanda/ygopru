[package]
name = "ygopro-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ygopro-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
clap = { version = "4", features = ["derive"] }
binrw = "0.13"
futures = "0.3"
log = "0.4"
pretty_env_logger = "0.5"

ygopro = { package = "ygopro-data", path = "../ygopro-data" }
