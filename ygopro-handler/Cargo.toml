[package]
name = "ygopro-handler"
version = "0.1.2"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "A type-erased, plugin-based message handler framework for YGOPro duel rooms."
readme = "README.md"
keywords = ["ygopro"]

[dependencies]
anymap3 = "1"
binrw = "0.13"
bytes = "1"
futures = "0"
hashbrown = "0.17"
pin-project-lite = "0"
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread"] }
tokio-stream = "0"
tower = { version = "0", features = ["util"] }
ygopro-data.workspace = true

[features]
default = []
card = ["ygopro-data/card"]
