[package]
name = "ygopro-derive"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Procedural macros for crates ygopro, ygopro-data and ygopro-handler."
keywords = ["ygopro"]

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
syn = { version = "1.0", features = ["full"] }
proc-macro2 = "1.0"
darling = "0.14"
